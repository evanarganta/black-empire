<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>black empire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">!</span>
        <span>black empire</span>
      </div>
      <div class="top-actions">
        <button class="button" id="open-button" type="button">open</button>
        <button class="button" id="chaos-button" type="button">chaos</button>
        <button class="button" id="reset-button" type="button">reset</button>
        <button class="button" id="copy-button" type="button" disabled>copy</button>
        <button class="button primary" id="export-button" type="button" disabled>export</button>
        <label class="export-format" for="export-format">
          <select class="format-select" id="export-format" aria-label="Export format">
            <option value="image/png">.PNG</option>
            <option value="image/jpeg">.JPG</option>
            <option value="image/webp">.WebP</option>
          </select>
        </label>
      </div>
    </header>

    <main class="workspace">
      <section class="stage" aria-label="Image preview">
        <div class="stage-head">
          <span class="photo-name" id="photo-name">no image loaded</span>
          <span class="photo-meta" id="photo-meta"></span>
        </div>
        <div class="canvas-wrap" id="drop-zone">
          <canvas id="preview" aria-label="Edited image preview"></canvas>
          <div class="empty-state" id="empty-state">
            <h1>drop a photo here or choose a file</h1>
            <p>local & private. your images stay on your device.</p>
            <button class="button" id="empty-open" type="button">choose image</button>
          </div>
        </div>
        <div class="stage-foot">
          <div class="stage-foot-left">
            <button class="button compare-btn" id="compare-button" type="button" disabled title="hold to view original">hold to compare</button>
            <span class="stage-hint" id="stage-hint">or hold space</span>
          </div>
          <span class="stage-scale" id="preview-note"></span>
        </div>
      </section>

      <aside class="controls" aria-label="Controls">
        <div class="presets-bar">
          <span class="preset-label">presets</span>
          <div class="preset-pills" id="preset-pills"></div>
        </div>
        <div id="controls-container"></div>
      </aside>
    </main>
  </div>

  <input id="file-input" type="file" accept="image/*">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js" defer></script>
</body>
</html>
